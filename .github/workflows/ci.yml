name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find app bootstrap config database lang routes tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Block committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.(local|production|backup))|\.sql$|\.pem$|id_rsa'; then
            echo "::error::A secret or database dump is tracked in Git. Remove it."
            exit 1
          fi
