name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax check
        run: |
          find api -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Site checks (index, forbidden files, secrets, broken links)
        run: python3 scripts/check_site.py
